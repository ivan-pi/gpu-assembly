name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or pull request supersedes the run in
# progress; nobody waits on results for a commit that is already gone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # -march=native so that reclu's AVX2 kernels, not their plain
          # fallbacks, are what its tests and the rbf_fd test exercise
          - name: gcc / gfortran
            os: ubuntu-latest
            packages: g++ gfortran liblapack-dev
            cxx: g++
            fc: gfortran
            cmake_args: -DGPU_ASSEMBLY_MARCH_NATIVE=ON

          # LLVM toolchain from the Ubuntu archive: clang++ for the C++
          # parts, LLVM flang (flang-new) for the Fortran modules.
          # libomp-N-dev gives both compilers their OpenMP runtime;
          # liblapack-dev is what the host RBF-FD module solves with.
          # flang-22 only ships in Ubuntu 26.04 (resolute); the
          # ubuntu-26.04 runner image is still in preview.
          - name: clang-22 / flang-22
            os: ubuntu-26.04
            packages: clang-22 flang-22 libomp-22-dev liblapack-dev
            cxx: clang++-22
            fc: flang-22
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
          ${{ matrix.cxx }} --version
          ${{ matrix.fc }} --version

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
          FC: ${{ matrix.fc }}
        run: cmake -B build ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Older LLVM release, as packaged by the current Ubuntu LTS. Kept apart
  # from host-tests because it matters less than the current toolchains.
  older-llvm:
    name: clang-20 / flang-20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-20 flang-20 libomp-20-dev liblapack-dev
          clang++-20 --version
          flang-20 --version

      - name: Configure
        env:
          CXX: clang++-20
          FC: flang-20
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
