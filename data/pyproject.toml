[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pointclouds"
version = "0.1"
description = "The point-cloud file formats of gpu-assembly, and what its data scripts share"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
tools = ["scipy", "matplotlib"]
reorder = ["scipy", "pymetis", "scikit-sparse"]

[tool.setuptools]
packages = ["pointclouds", "pointclouds.io"]
