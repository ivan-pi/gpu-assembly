[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pointclouds"
version = "0.1"
description = "The point-cloud file formats of gpu-assembly, and what its data scripts share"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
tools = ["scipy", "matplotlib"]
generate = ["scipy", "numba"]
reorder = ["scipy", "pymetis", "scikit-sparse"]

[tool.setuptools]
packages = ["pointclouds", "pointclouds.io"]

# Formatting and linting: `black .` and `ruff check .` from this directory.
[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pyflakes and the pycodestyle errors, plus import sorting
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pointclouds"]
